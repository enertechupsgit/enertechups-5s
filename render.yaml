# Frontend and API share one HTTPS origin; PostgreSQL stores records and evidence.
services:
  - type: web
    name: enertechups-5s
    runtime: docker
    rootDir: .
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: LOCAL_DEMO
        value: "0"
      - key: DATABASE_URL
        fromDatabase:
          name: enertech-5s-db
          property: connectionString
      - key: BOOTSTRAP_TOKEN
        generateValue: true
      - key: BOOTSTRAP_ADMIN_EMAIL
        value: marketing@enertechups.com
databases:
  - name: enertech-5s-db
    plan: free
    region: singapore
    databaseName: enertech5s
    user: enertech5s
