services:
  # 1. FastAPI Backend API
  - type: web
    name: enertech-5s-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: enertech-5s-db
          property: connectionString

  # 2. React + Vite Frontend
  - type: web
    name: enertech-5s-frontend
    runtime: static
    rootDir: apps/web
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://enertech-5s-backend.onrender.com/api/v1

# 3. Managed PostgreSQL Database
databases:
  - name: enertech-5s-db
    plan: free
